      min_height: 0.0
      max_height: 2.0
      enabled: true
      source_timeout: 0.5
    use_sim_time: true
    enable_stamped_cmd_vel: false
    StopZone:
      type: velocity_polygon
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: vacuum_stopzone
      enabled: true
      holonomic: false
      velocity_polygons:
