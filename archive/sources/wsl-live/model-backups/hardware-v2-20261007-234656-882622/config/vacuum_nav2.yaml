      always_send_full_costmap: true
      use_sim_time: true
      footprint: '[[0.120726, 0.0], [0.11783, 0.029405], [0.109252, 0.05768], [0.095324,
        0.083739], [0.076579, 0.106579], [0.053739, 0.125324], [0.02768, 0.139252],
