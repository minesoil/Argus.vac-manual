controller_manager:
  ros__parameters:
    update_rate: 60
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names:
    - left_wheel_joint
    right_wheel_names:
    - right_wheel_joint
    wheel_separation: 0.22
    wheel_radius: 0.035
    publish_rate: 60.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: true
    cmd_vel_timeout: 0.25
    pose_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.01
    twist_covariance_diagonal:
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.001
    - 0.01
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.5
    linear.x.min_velocity: -0.9
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 6.0
    linear.x.min_acceleration: -6.0
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.4
    angular.z.min_velocity: -2.4
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 14.0
    angular.z.min_acceleration: -14.0
    velocity_rolling_window_size: 1
    linear.x.has_jerk_limits: false
    angular.z.has_jerk_limits: false
