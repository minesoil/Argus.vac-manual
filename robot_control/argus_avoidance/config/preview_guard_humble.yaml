avoidance_preview_guard:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /avoidance/guard_input
    cmd_vel_out_topic: /avoidance/guarded_cmd_vel
    transform_tolerance: 0.2
    source_timeout: 0.5
    stop_pub_timeout: 1.0
    polygons: [StopZone]
    StopZone:
      type: polygon
      points: [0.30, 0.22, 0.30, -0.22, -0.30, -0.22, -0.30, 0.22]
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: /avoidance/preview_stop_zone
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
