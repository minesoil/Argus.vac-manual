# Optional replacement for the previous avoidance-usb.conf ExecStart override.
# Install only after checking existing drop-ins; keep one effective ExecStart.
[Service]
WorkingDirectory=/home/orangepi/argus/avoidance
ExecStart=
ExecStart=/usr/bin/python3 -u -m argus_avoidance.usb_bridge --serial /dev/ttyS0 --no-phone-preview --manual-guard --roam-config .state/roam.json
