# Installed as /etc/systemd/system/argus-bridge.service.d/avoidance-usb.conf.
# The existing service requires argus-camera.service and runs as orangepi.
[Unit]
Description=Argus ESP32 serial control bridge

[Service]
WorkingDirectory=/home/orangepi/argus/avoidance
ExecStart=
ExecStart=/usr/bin/python3 -u -m argus_avoidance.usb_bridge --serial /dev/ttyS0 --no-phone-preview
Restart=on-failure
RestartSec=2
